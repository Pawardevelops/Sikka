name: Bug Report
description: Create a report to help us improve Sikka
title: "bug: "
labels: ["bug"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please provide as much detail as possible.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this bug?
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What happened instead?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device Information
      description: What device and Android version are you using?
      placeholder: e.g., Pixel 7, Android 14
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Video
      description: If applicable, add screenshots or a screen recording to help explain your problem.
    validations:
      required: false
